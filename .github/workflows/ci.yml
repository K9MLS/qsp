name: CI

# **CI does not run on every push any more.**
#
# It ran eight jobs on every commit to main — build and vet, tests, the race
# detector, the documentation gate, staticcheck, and three cross-compiles —
# each paying its own checkout and Go setup. About three minutes of that was
# runner startup before any work happened, and at the rate this project pushes
# it consumed most of a month's minutes in a fortnight.
#
# Five of those six jobs also duplicate what the development machine runs before
# every patch: gofmt, go vet, staticcheck, the full suite and the race detector.
# Paying a hosted runner to repeat a check that has already passed locally buys
# nothing but a second opinion on the same commit.
#
# So it runs when asked, weekly, and on a release tag. The weekly run is the one
# that catches what a local run cannot: a toolchain or an action that has moved
# under a commit nobody touched.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    # Monday morning, so a week of drift is found before a week of work is
    # built on top of it.
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  # Pinned: ADR-0004's reproducibility argument applies to the toolchain too.
  # An unpinned @latest lets an upstream release turn a green commit red without
  # a line of QSP changing. Bump deliberately, in its own commit.
  STATICCHECK_VERSION: "2026.2.1"

jobs:
  # **One job, not eight.** Every one of them checked out the repository and
  # installed Go before doing thirty seconds of work, and none needed to run in
  # parallel — nothing here takes long enough for the wall-clock saving to be
  # worth six runner startups.
  #
  # Ordered cheapest first, so a formatting mistake fails in twenty seconds
  # rather than after the race detector.
  ci:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak > /dev/null; then
            echo "go.mod is not tidy. Run: go mod tidy"
            diff go.mod.bak go.mod || true
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: |
          curl -sSfL -o /tmp/staticcheck.tar.gz \
            "https://github.com/dominikh/go-tools/releases/download/${STATICCHECK_VERSION}/staticcheck_linux_amd64.tar.gz"
          tar -C /tmp -xzf /tmp/staticcheck.tar.gz
          sudo mv /tmp/staticcheck/staticcheck /usr/local/bin/

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      # ADR-0009 keeps Opus behind the zello build tag, so every step above
      # compiles none of qsp-zello, internal/opus or internal/zellobridge. A
      # tag nothing builds is code nothing checks.
      - name: Vet and test the zello-tagged connector
        env:
          CGO_ENABLED: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libopus-dev
          go vet -tags zello ./cmd/qsp-zello/ ./internal/opus/ ./internal/zellobridge/
          staticcheck -tags zello ./cmd/qsp-zello/ ./internal/opus/ ./internal/zellobridge/
          go test -race -tags zello ./cmd/qsp-zello/ ./internal/opus/ ./internal/zellobridge/

      # ADR-0001 and ADR-0009: the core must stay pure Go and cross-compilable
      # to every target from one machine. CGO_ENABLED=0 makes a cgo dependency
      # fail here rather than at a user's install.
      #
      # **This is the check the development machine does not do**, along with
      # the go.mod tidiness above. Everything else in this job repeats a local
      # run; these two are why CI still exists at all.
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/qsp
          GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/qsp
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o /dev/null ./cmd/qsp

  # **The published image** (0412), so the Docker instructions work for somebody
  # who has never built QSP: ghcr.io/k9mls/qsp:<version> and :latest, for amd64
  # and arm64. 32-bit ARM is not published — Docker Engine 28 was the last to
  # package 32-bit Raspberry Pi OS — and the plain binary still runs there.
  #
  # Only on a release tag, and only after `ci` has passed, so a release whose
  # tests fail never becomes an image.
  image:
    name: Publish image
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Scoped to this job: nothing else in the workflow can publish.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # **The tag must be the version the tree says it is.** A tag typed wrong
      # would otherwise publish an image whose tag and whose own -version
      # disagree — the kind of mismatch §7's check-the-running-binary rule
      # exists to catch, arriving at somebody else's install.
      - name: Check the tag matches VERSION
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "Tag v$tag does not match VERSION ($file); not publishing."
            exit 1
          fi
          echo "version=$file" >> "$GITHUB_OUTPUT"

      # Third-party actions are pinned to full commit SHAs, which GitHub's
      # documentation calls the only immutable way to use one; a tag can be
      # moved to different code. The comment names the release each SHA is.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Provenance at max and an SBOM, so anybody can see what an image was
      # built from. GHCR's package page lists each as an extra "unknown/unknown"
      # platform; that is expected, and deploy/docker/README.md says so. No
      # build argument carries a secret — provenance records them.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/k9mls/qsp:${{ steps.version.outputs.version }}
            ghcr.io/k9mls/qsp:latest

      # **The Zello connector's image** (0415), for docker-compose.zello.yml:
      # ghcr.io/k9mls/qsp-zello:<version> and :latest. It is the one cgo binary,
      # so its Dockerfile installs the target's C compiler and libopus and links
      # statically; it still cross-compiles on the runner rather than emulating
      # arm64, so this job needs no QEMU step. Same job, same gate: nothing here
      # runs unless `ci` passed and the tag matched VERSION above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.zello
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/k9mls/qsp-zello:${{ steps.version.outputs.version }}
            ghcr.io/k9mls/qsp-zello:latest
