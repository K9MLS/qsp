<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — QSP</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/console.css">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
</head>
<body class="signin-body">
<a class="skip-link" href="#main">Skip to main content</a>

<main class="signin" id="main">

  <header class="signin__head">
    <svg class="signin__mark" viewBox="0 0 32 32" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false">
      <path d="M16 21.5v6.5M11 28h10"/>
      <circle cx="16" cy="16" r="2.6" fill="currentColor" stroke="none"/>
      <path d="M10.6 21.4a7.6 7.6 0 0 1 0-10.8M21.4 10.6a7.6 7.6 0 0 1 0 10.8"/>
      <path d="M6.6 25.4a13.3 13.3 0 0 1 0-18.8M25.4 6.6a13.3 13.3 0 0 1 0 18.8"/>
    </svg>
    <h1 class="signin__title">Sign in</h1>
    <p class="signin__lede">
      Administrators only. The console itself needs no account — everything
      it shows is readable without one.
    </p>
  </header>

  <!-- Shown when the instance has no accounts. A form that cannot succeed is
       worse than no form: an operator would try their callsign, fail, and have
       no way to learn what they are missing.

       It sends them to the setup page rather than to a shell (ADR-0056). The
       command survives only as the recovery procedure for having lost every
       administrator, and that lives in the README. -->
  <div class="notice notice--warn" id="no-accounts" hidden>
    <p class="notice__title">This server has no administrator yet</p>
    <p class="notice__body">
      <a href="/setup">Set it up</a> — it takes a callsign and a password.
    </p>
  </div>

  <div class="notice notice--warn" id="error" hidden>
    <p class="notice__body" id="error-text"></p>
  </div>

  <div class="signin__panel" id="form" hidden>
    <div class="field">
      <label class="field__label" for="username">Callsign</label>
      <input class="field__input" id="username" name="username" type="text"
             autocomplete="username" autocapitalize="characters" spellcheck="false"
             required>
    </div>

    <div class="field">
      <label class="field__label" for="password">Password</label>
      <input class="field__input" id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>

    <button class="button" id="submit" type="button">Sign in</button>
  </div>

  <div class="signin__panel" id="signed-in" hidden>
    <p class="signin__who">Signed in as <strong id="who"></strong>.</p>
    <div class="signin__actions">
      <a class="button" href="/">Go to the console</a>
      <button class="button button--quiet" id="logout" type="button">Sign out</button>
    </div>
  </div>

</main>

<script src="/signin.js"></script>
</body>
</html>
